<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmuration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&display=swap">
<style>
  :root{
    --night:#121626; --rule:#2E3650; --paper:#EDE6DA;
    --dim:#8A90A6; --cyan:#4FC9E6; --ember:#FF7A4F;
    --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--night); color:var(--paper);
    font-family:var(--mono); overflow:hidden;
  }
  #view{
    display:block; width:100vw; height:100vh;
    cursor:crosshair; touch-action:none;
  }

  .hud{
    position:fixed; inset:0; pointer-events:none;
    padding:18px 22px;
    display:grid; grid-template-rows:auto 1fr auto; gap:10px;
  }
  .top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap}

  h1{
    font-family:"Fraunces", Georgia, serif;
    font-variation-settings:"SOFT" 34,"WONK" 1,"opsz" 90;
    font-weight:600; font-size:1.9rem; line-height:1; margin:0;
    letter-spacing:-.02em;
    text-shadow:0 2px 24px rgba(8,10,18,.8);
  }
  .sub{
    font-size:.68rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--dim); margin:6px 0 0;
    text-shadow:0 1px 14px rgba(8,10,18,.9);
  }

  .stats{
    display:flex; gap:18px; font-size:.72rem;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 14px rgba(8,10,18,.9);
  }
  .stats div{display:flex; flex-direction:column; gap:2px; align-items:flex-end}
  .k{font-size:.58rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
  .v{font-size:1rem; color:var(--paper)}

  .bottom{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap}
  .hint{font-size:.68rem; color:var(--dim); text-shadow:0 1px 14px rgba(8,10,18,.9)}

  label{
    pointer-events:auto; display:flex; align-items:center; gap:8px;
    font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
  }
  select{
    pointer-events:auto;
    font-family:var(--mono); font-size:.72rem;
    background:rgba(12,17,28,.72); color:var(--paper);
    border:1px solid var(--rule); border-radius:1px;
    padding:7px 10px; cursor:pointer;
  }
  select:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}

  #fail{
    position:fixed; inset:0; display:grid; place-items:center;
    background:var(--night); color:var(--ember);
    font-size:.85rem; padding:40px; text-align:center; line-height:1.7;
  }
  #fail[hidden]{display:none}

  @media (max-width:560px){
    h1{font-size:1.4rem}
    .stats{gap:12px}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud">
  <div class="top">
    <div>
      <h1>Murmuration</h1>
      <p class="sub">Reynolds steering · GPU counting sort · WebGPU compute</p>
    </div>
    <div class="stats">
      <div><span class="k">Birds</span><span class="v" id="count">—</span></div>
      <div><span class="k">Dispersed</span><span class="v" id="dispersed">0</span></div>
      <div><span class="k">FPS</span><span class="v" id="fps">—</span></div>
      <div><span class="k">GPU</span><span class="v"><span id="gpums">—</span> ms</span></div>
    </div>
  </div>

  <div></div>

  <div class="bottom">
    <p class="hint">Move the pointer into the flock — the birds mob it, the way starlings mob a hawk. Hold to fire a pulse and cut a corridor through them.</p>
    <label for="agents">Flock size
      <select id="agents">
        <option value="250000">250,000</option>
        <option value="1000000" selected>1,000,000</option>
        <option value="2000000">2,000,000</option>
        <option value="4000000">4,000,000</option>
      </select>
    </label>
  </div>
</div>

<div id="fail" hidden></div>

<script type="module" src="/src/app.ts"></script>
</body>
</html>
